services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: hotel-booking-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - hotel-booking-caddy-data:/data
      - hotel-booking-caddy-config:/config
    depends_on:
      api-gateway:
        condition: service_healthy

  kafka:
    ports: !reset []

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: postgres
    ports: !reset []

  prometheus:
    profiles: ["observability"]
    ports: !reset []

  grafana:
    profiles: ["observability"]
    ports: !reset []

  mailpit:
    ports: !reset []

  api-gateway:
    environment:
      TRUST_FORWARDED_HEADERS: "true"
    ports: !override
      - "127.0.0.1:8080:8080"

  hotel-service:
    ports: !reset []

  booking-service:
    ports: !reset []

  identity-service:
    ports: !reset []

  notification-service:
    ports: !reset []

volumes:
  hotel-booking-caddy-data:
  hotel-booking-caddy-config:
