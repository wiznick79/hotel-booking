services:
  kafka:
    ports: !reset []

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: postgres
    ports: !reset []

  prometheus:
    profiles: ["observability"]
    ports: !reset []

  grafana:
    profiles: ["observability"]
    ports: !reset []

  mailpit:
    ports: !reset []

  api-gateway:
    ports:
      - "127.0.0.1:8080:8080"

  hotel-service:
    ports: !reset []

  booking-service:
    ports: !reset []

  identity-service:
    ports: !reset []

  notification-service:
    ports: !reset []
