name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-tests:
    name: Public website browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/public-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/public-web/package-lock.json
      - run: npm ci
      - run: npm --prefix ../admin-web ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npx playwright test -c playwright.admin.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-web-browser-report
          path: |
            frontend/public-web/playwright-report/
            frontend/public-web/test-results/
          retention-days: 7

  verify:
    name: Build, test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Generate ephemeral JWT signing keys
        shell: bash
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
          echo "JWT_PRIVATE_KEY_BASE64=$(openssl pkcs8 -topk8 -nocrypt -in jwt-private.pem -outform DER | openssl base64 -A)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$(openssl pkey -in jwt-private.pem -pubout -outform DER | openssl base64 -A)" >> "$GITHUB_ENV"
          rm jwt-private.pem

      - name: Run Maven verification
        run: ./mvnw -B verify

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/public-web/package-lock.json
      - name: Install full-stack browser test tools
        working-directory: frontend/public-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test browser booking against disposable services
        working-directory: frontend/public-web
        run: node tests/full-stack/run.mjs
