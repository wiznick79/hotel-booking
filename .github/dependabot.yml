version: 2

multi-ecosystem-groups:
  container-base-images:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: npm
    directory: "/frontend/admin-web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: npm
    directory: "/frontend/public-web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: docker
    directory: "/services/hotel-service"
    patterns:
      - "*"
    multi-ecosystem-group: container-base-images
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: "/services/booking-service"
    patterns:
      - "*"
    multi-ecosystem-group: container-base-images
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: "/services/identity-service"
    patterns:
      - "*"
    multi-ecosystem-group: container-base-images
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: "/services/notification-service"
    patterns:
      - "*"
    multi-ecosystem-group: container-base-images
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: "/services/api-gateway"
    patterns:
      - "*"
    multi-ecosystem-group: container-base-images
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: "/frontend/admin-web"
    patterns:
      - "*"
    multi-ecosystem-group: container-base-images
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: "/frontend/public-web"
    patterns:
      - "*"
    multi-ecosystem-group: container-base-images
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      patch-updates:
        update-types:
          - patch
