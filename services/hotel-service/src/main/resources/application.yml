spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:file:./data/hotel-service
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true

hotel:
  i18n:
    default-language: en

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
