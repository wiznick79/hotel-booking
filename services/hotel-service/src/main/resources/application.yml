spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:file:./data/hotel-service
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  cache:
    type: simple
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

  h2:
    console:
      enabled: true

hotel:
  i18n:
    default-language: en

website-media:
  storage-path: ${WEBSITE_MEDIA_STORAGE_PATH:./data/website-media}

jwt:
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

server:
  port: 8081

app:
  use-swagger: ${USE_SWAGGER:false}

springdoc:
  api-docs:
    enabled: ${app.use-swagger}
  swagger-ui:
    enabled: ${app.use-swagger}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
