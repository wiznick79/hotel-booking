spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:file:./data/hotel-service
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

  h2:
    console:
      enabled: true

hotel:
  i18n:
    default-language: en

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
