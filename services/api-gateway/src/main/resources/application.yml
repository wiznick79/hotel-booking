spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          default-filters:
            - name: Retry
              args:
                retries: 1
                methods: GET
                series: SERVER_ERROR
          routes:
            - id: public-login-rate-limit
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/auth/login
                - Method=POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: identityService
                    fallbackUri: forward:/fallback/identity-service
                    statusCodes: 500,502,503,504
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@clientIpKeyResolver}"
            - id: public-booking-rate-limit
              uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/reservations
                - Method=POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: bookingService
                    fallbackUri: forward:/fallback/booking-service
                    statusCodes: 500,502,503,504
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@clientIpKeyResolver}"
            - id: public-contact-rate-limit
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/contact-messages
                - Method=POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: notificationService
                    fallbackUri: forward:/fallback/notification-service
                    statusCodes: 500,502,503,504
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@clientIpKeyResolver}"
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: identityService
                    fallbackUri: forward:/fallback/identity-service
                    statusCodes: 500,502,503,504
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/contact-messages/**,/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notificationService
                    fallbackUri: forward:/fallback/notification-service
                    statusCodes: 500,502,503,504
            - id: hotel-service-openapi
              uri: ${HOTEL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/swagger/hotel-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: booking-service-openapi
              uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/swagger/booking-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: identity-service-openapi
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/swagger/identity-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: notification-service-openapi
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/swagger/notification-service/v3/api-docs
              filters:
                - StripPrefix=2
            - id: hotel-service
              uri: ${HOTEL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/hotels/**,/api/rooms/**,/api/room-types/**,/api/pricing-rules/**,/api/room-unavailabilities/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: hotelService
                    fallbackUri: forward:/fallback/hotel-service
                    statusCodes: 500,502,503,504
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/reservations/**,/api/booking-policies/**,/api/discount-codes/**,/api/outbox-events/**,/api/payment-methods/**,/api/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: bookingService
                    fallbackUri: forward:/fallback/booking-service
                    statusCodes: 500,502,503,504
  webflux:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type
      exposed-headers: Location,X-Guest-Access-Token
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      identityService:
        base-config: default
      bookingService:
        base-config: default
      notificationService:
        base-config: default
      hotelService:
        base-config: default

server:
  port: 8080

app:
  use-swagger: ${USE_SWAGGER:false}
  trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}

springdoc:
  api-docs:
    enabled: ${app.use-swagger}
  swagger-ui:
    enabled: ${app.use-swagger}
    urls:
      - name: hotel-service
        url: /swagger/hotel-service/v3/api-docs
      - name: booking-service
        url: /swagger/booking-service/v3/api-docs
      - name: identity-service
        url: /swagger/identity-service/v3/api-docs
      - name: notification-service
        url: /swagger/notification-service/v3/api-docs

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
