spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: public-login-rate-limit
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/auth/login
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@clientIpKeyResolver}"
            - id: public-booking-rate-limit
              uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/reservations
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@clientIpKeyResolver}"
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: hotel-service
              uri: ${HOTEL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/hotels/**,/api/rooms/**,/api/room-types/**,/api/rate-periods/**,/api/room-unavailabilities/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/reservations/**,/api/booking-policies/**,/api/discount-codes/**,/api/outbox-events/**
  webflux:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type
      exposed-headers: Location
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
