server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:file:./data/notification-service
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

booking-events:
  topic: reservation-events

notification:
  retry-delay-ms: 60000
  kafka:
    retry-delay-ms: 1000
    max-retries: 3

public-frontend:
  base-url: ${PUBLIC_FRONTEND_BASE_URL:http://localhost:3000}

guest-access:
  encryption-secret: ${GUEST_ACCESS_ENCRYPTION_SECRET:change-this-development-secret}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
