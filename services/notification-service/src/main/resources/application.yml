server:
  port: 8084

app:
  use-swagger: ${USE_SWAGGER:false}

springdoc:
  api-docs:
    enabled: ${app.use-swagger}
  swagger-ui:
    enabled: ${app.use-swagger}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:file:./data/notification-service
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}

booking-events:
  topic: reservation-events
  topics:
    auto-create: ${BOOKING_EVENTS_TOPICS_AUTO_CREATE:true}

identity-events:
  topic: identity-events

notification:
  retry-delay-ms: 60000
  kafka:
    retry-delay-ms: 1000
    max-retries: 3
  maximum-attempts: 3
  email:
    from: ${NOTIFICATION_EMAIL_FROM:no-reply@hotelbooking.local}
  contact:
    default-recipient: ${NOTIFICATION_CONTACT_DEFAULT_RECIPIENT:}

public-frontend:
  base-url: ${PUBLIC_FRONTEND_BASE_URL:http://localhost:3002}

hotel-service:
  url: ${HOTEL_SERVICE_URL:http://localhost:8081}

guest-access:
  encryption-secret: ${GUEST_ACCESS_ENCRYPTION_SECRET:change-this-development-secret}

account-verification:
  encryption-secret: ${ACCOUNT_VERIFICATION_ENCRYPTION_SECRET:change-this-development-secret}

jwt:
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
