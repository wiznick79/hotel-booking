spring:
  application:
    name: identity-service
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:file:./data/identity;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8083

app:
  use-swagger: ${USE_SWAGGER:false}

springdoc:
  api-docs:
    enabled: ${app.use-swagger}
  swagger-ui:
    enabled: ${app.use-swagger}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

jwt:
  private-key-base64: ${JWT_PRIVATE_KEY_BASE64}
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

identity-events:
  topic: identity-events
  topics:
    auto-create: ${IDENTITY_EVENTS_TOPICS_AUTO_CREATE:true}

identity:
  outbox:
    dispatch-delay-ms: 5000
    maximum-attempts: 8
    initial-retry-delay-seconds: 30
    maximum-retry-delay-seconds: 3600

account-verification:
  encryption-secret: ${ACCOUNT_VERIFICATION_ENCRYPTION_SECRET:change-this-development-secret}
