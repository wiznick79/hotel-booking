spring:
  application:
    name: booking-service
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:file:./data/booking-service
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8082

app:
  use-swagger: ${USE_SWAGGER:false}

springdoc:
  api-docs:
    enabled: ${app.use-swagger}
  swagger-ui:
    enabled: ${app.use-swagger}

booking:
  guest-access:
    grace-period-days: 7
  notifications:
    retry-delay-ms: 60000
  outbox:
    dispatch-delay-ms: 5000
    maximum-attempts: 8
    initial-retry-delay-seconds: 30
    maximum-retry-delay-seconds: 3600

payment:
  local-simulation:
    enabled: ${PAYMENT_LOCAL_SIMULATION_ENABLED:false}
    public-frontend-base-url: ${PUBLIC_FRONTEND_BASE_URL:http://localhost:3002}
  stripe:
    enabled: ${PAYMENT_STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    public-frontend-base-url: ${PUBLIC_FRONTEND_BASE_URL:http://localhost:3002}

hotel-service:
  url: ${HOTEL_SERVICE_URL:http://localhost:8081}
  connect-timeout-ms: ${HOTEL_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${HOTEL_SERVICE_READ_TIMEOUT_MS:5000}

resilience4j:
  circuitbreaker:
    instances:
      hotelService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        event-consumer-buffer-size: 20
        record-exceptions:
          - pt.hotelbooking.booking.integration.HotelServiceUnavailableException
  retry:
    instances:
      hotelService:
        max-attempts: 2
        wait-duration: 150ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - pt.hotelbooking.booking.integration.HotelServiceUnavailableException

booking-events:
  topic: reservation-events

jwt:
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
guest-access:
  encryption-secret: ${GUEST_ACCESS_ENCRYPTION_SECRET:change-this-development-secret}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
