spring:
  application:
    name: booking-service
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:file:./data/booking-service
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8082

booking:
  guest-access:
    grace-period-days: 7
  notifications:
    retry-delay-ms: 60000
  outbox:
    dispatch-delay-ms: 5000
    maximum-attempts: 8
    initial-retry-delay-seconds: 30
    maximum-retry-delay-seconds: 3600

hotel-service:
  url: ${HOTEL_SERVICE_URL:http://localhost:8081}
  connect-timeout-ms: ${HOTEL_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${HOTEL_SERVICE_READ_TIMEOUT_MS:5000}

booking-events:
  topic: reservation-events

jwt:
  secret: ${JWT_SECRET}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
guest-access:
  encryption-secret: ${GUEST_ACCESS_ENCRYPTION_SECRET:change-this-development-secret}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
