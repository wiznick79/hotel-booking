services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: hotel-booking-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hotel-booking-redis
    command: redis-server --appendonly yes
    volumes:
      - hotel-booking-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: hotel-booking-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hotel-booking-prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    container_name: hotel-booking-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - hotel-booking-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  mailpit:
    image: axllent/mailpit:v1.27.7
    container_name: hotel-booking-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  public-web:
    build:
      context: .
      dockerfile: frontend/public-web/Dockerfile
    ports:
      - "3002:80"
    depends_on:
      api-gateway:
        condition: service_started

  admin-web:
    build:
      context: .
      dockerfile: frontend/admin-web/Dockerfile
    ports:
      - "3004:80"
    depends_on:
      api-gateway:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8083
      HOTEL_SERVICE_URL: http://hotel-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      USE_SWAGGER: ${USE_SWAGGER:-false}
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: hotel-booking-postgres
    environment:
      POSTGRES_USER: hotel_booking
      POSTGRES_PASSWORD: hotel_booking_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - hotel-booking-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_booking -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  hotel-service:
    build:
      context: .
      dockerfile: services/hotel-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      HOTEL_DB_URL: jdbc:postgresql://postgres:5432/hotel_service
      HOTEL_DB_USERNAME: hotel_booking
      HOTEL_DB_PASSWORD: ${POSTGRES_PASSWORD:-hotel_booking_dev_password}
      REDIS_HOST: redis
      USE_SWAGGER: ${USE_SWAGGER:-false}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      BOOKING_DB_URL: jdbc:postgresql://postgres:5432/booking_service
      BOOKING_DB_USERNAME: hotel_booking
      BOOKING_DB_PASSWORD: ${POSTGRES_PASSWORD:-hotel_booking_dev_password}
      HOTEL_SERVICE_URL: http://hotel-service:8081
      GUEST_ACCESS_ENCRYPTION_SECRET: ${GUEST_ACCESS_ENCRYPTION_SECRET:-local-development-encryption-secret-change-me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USE_SWAGGER: ${USE_SWAGGER:-false}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      kafka:
        condition: service_healthy

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres,dev
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?JWT_PRIVATE_KEY_BASE64 must be set}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_service
      IDENTITY_DB_USERNAME: hotel_booking
      IDENTITY_DB_PASSWORD: ${POSTGRES_PASSWORD:-hotel_booking_dev_password}
      USE_SWAGGER: ${USE_SWAGGER:-false}
      AUTH_REFRESH_COOKIE_SECURE: "false"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_service
      NOTIFICATION_DB_USERNAME: hotel_booking
      NOTIFICATION_DB_PASSWORD: ${POSTGRES_PASSWORD:-hotel_booking_dev_password}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      GUEST_ACCESS_ENCRYPTION_SECRET: ${GUEST_ACCESS_ENCRYPTION_SECRET:-local-development-encryption-secret-change-me}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-no-reply@hotelbooking.local}
      USE_SWAGGER: ${USE_SWAGGER:-false}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  hotel-booking-postgres-data:
  hotel-booking-redis-data:
  hotel-booking-prometheus-data:
  hotel-booking-grafana-data:
