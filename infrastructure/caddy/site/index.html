<!doctype html>
<html lang="en">
<head>

    <title>Hotel Booking</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, system-ui, sans-serif;
        }

        body {
            align-items: center;
            background: #f4f1ec;
            color: #1f2933;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 2rem;
        }

        main {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgb(31 41 51 / 12%);
            max-width: 38rem;

        h1 {
            color: #284b63;
            font-size: clamp(2rem, 5vw, 3rem);

        }

        p {

            line-height: 1.6;

<main>
